[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fileformats-medimage"
description = "Classes for representing various medical imaging file formats in Python classes for use in type hinting in data workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fileformats >=0.15", "typing_extensions>=4.16.0"]
license = { file = "LICENSE" }
authors = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
maintainers = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
keywords = ["file formats", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
    "codespell",
    "flake8",
    "flake8-pyproject",
    "typing_extensions >= 4.6",
]
test = [
    "pytest >=6.2.5",
    "pytest-env>=0.6.2",
    "pytest-cov>=2.12.1",
    "medimages4tests >=0.5.10",
    "mypy >=1.5.1",
    "fileformats-medimage-extras",
    "pydra-tasks-dcm2niix",
    "pydra-tasks-mrtrix3 >=3.0.4a13",
]


[project.urls]
repository = "https://github.com/ArcanaFramework/fileformats-medimage"


[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "fileformats/medimage/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["fileformats"]
exclude = ["tests"]
include = ["./fileformats"]

[tool.black]
target-version = ['py312']
exclude = "fileformats/medimage/_version.py"

[tool.codespell]
ignore-words = ".codespell-ignorewords"

[tool.mypy]
ignore_missing_imports = true
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = ["tests"]

[tool.flake8]
doctests = true
per-file-ignores = ["__init__.py:F401"]
max-line-length = 88
select = "C,E,F,W,B,B950"
extend-ignore = ['E203', 'E501', 'E129', 'W503', 'E701']
